    <text x="75" y="372" fill="#8b949e">Code: </text><text x="145" y="372" fill="#f0f6fc">stripe_key = os.environ["STRIPE_SECRET_KEY"]</text>
    <text x="75" y="402" fill="#d29922">Action: </text><text x="165" y="402" fill="#f0f6fc">Add 'STRIPE_SECRET_KEY=...' to .env.example</text>

